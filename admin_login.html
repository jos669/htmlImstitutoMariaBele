<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Acceso Administrativo - Instituto Nacional MB Medrano</title>
    <link rel="stylesheet" href="./static/css/style.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <meta name="csrf-token" content="">
<script src="./config.js"></script>
<script>
(function () {
  var base = (window.API_BASE || '').replace(/\/+$/, '');
  var origFetch = window.fetch;
  window.fetch = function (url, opts) {
    opts = opts || {};
    opts.credentials = 'include'; // sesión cross-origin
    if (typeof url === 'string' && url.indexOf('/api/') === 0 && base) url = base + url;
    return origFetch(url, opts);
  };
  var origOpen = window.open;
  window.open = function (url, target, features) {
    if (typeof url === 'string' && url.indexOf('/api/') === 0 && base) url = base + url;
    return origOpen(url, target, features);
  };
  // Cargar el token CSRF en el meta antes de cualquier POST
  if (base) {
    fetch(base + '/api/csrf-token', { credentials: 'include' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        var m = document.querySelector('meta[name="csrf-token"]');
        if (m && d.csrf_token) m.setAttribute('content', d.csrf_token);
      })
      .catch(function () {});
  }
})();
</script>

    <style>
        .btn-loading {
            position: relative;
            color: transparent !important;
            pointer-events: none;
        }
        .btn-loading::after {
            content: "";
            position: absolute;
            width: 16px;
            height: 16px;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            margin: auto;
            border: 3px solid transparent;
            border-top-color: currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <div class="login-wrapper" style="min-height: 90vh;">
            <div class="login-card login-estudiante" style="position: relative;">
                <button type="button" id="theme-toggle" class="header-icon-btn" style="position:absolute;top:1rem;right:1rem;z-index:10;background:transparent;color:var(--text-secondary);border:1px solid var(--border);" title="Cambiar tema"><i class="ph ph-sun-dim"></i></button>

                <img src="./static/logo.png" alt="Logo" style="height: 80px; width: 80px; object-fit: contain; display: block; margin: 0 auto 16px;">
                <h1 style="font-size: 1.2rem;">Acceso Administrativo</h1>
                <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.85rem;">
                    Instituto Nacional María Belén Medrano García
                </p>

                <div id="error-alert" class="alert alert-danger" style="display: none; margin-bottom: 1.5rem;"></div>

                <form id="admin-login-form">
                    <div style="margin-bottom: 1rem;">
                        <label for="admin-username" style="display: block; font-weight: 500; margin-bottom: 0.35rem; font-size: 0.85rem; color: var(--text-secondary);">Usuario / CUI Administrativo</label>
                        <input type="text" id="admin-username" class="input-busqueda" placeholder="Ej. admin" required autocomplete="username" maxlength="100" style="width: 100%;">
                    </div>

                    <div style="margin-bottom: 1rem; position: relative;">
                        <label for="admin-password" style="display: block; font-weight: 500; margin-bottom: 0.35rem; font-size: 0.85rem; color: var(--text-secondary);">Contraseña</label>
                        <input type="password" id="admin-password" class="input-busqueda" placeholder="••••••••" required autocomplete="current-password" style="width: 100%; padding-right: 2.5rem;">
                        <button type="button" id="toggle-password" style="position: absolute; right: 0.5rem; bottom: 0.4rem; background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--text-secondary); padding: 0.25rem; line-height: 1;" tabindex="-1"><i class="ph ph-eye"></i></button>
                    </div>

                    <button type="submit" id="btn-login-submit" class="btn-ingresar">
                        <i class="ph ph-shield-check"></i> Iniciar Sesión
                    </button>
                </form>

                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="./portal.html" style="color: var(--accent); text-decoration: none; font-weight: 500; font-size: 0.85rem;">
                        <i class="ph ph-arrow-left"></i> Volver al Portal de Estudiantes
                    </a>
                </div>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Instituto Nacional María Belén Medrano García — Sistema de Certificación Escolar. Guatemala.</p>
    </footer>

    <script src="./static/js/admin_login.js"></script>
</body>
</html>
